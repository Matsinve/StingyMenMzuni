<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Page</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --text-color: #333;
            --bg-color: #f9f9f9;
            --card-bg: #fff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --primary-color: #5dade2;
            --secondary-color: #34495e;
            --text-color: #f5f5f5;
            --bg-color: #1a1a1a;
            --card-bg: #2c2c2c;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        header {
            background-color: var(--secondary-color);
            color: white;
            padding: 1rem;
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            right: 20px;
            top: 20px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        h1, h2 {
            margin-bottom: 1rem;
            color: var(--secondary-color);
        }

        p {
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        .counter-display {
            font-size: 2rem;
            font-weight: bold;
            margin: 1rem 0;
            color: var(--primary-color);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        input, textarea {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        footer {
            background-color: var(--secondary-color);
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Simple Web Page</h1>
        <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>

    <div class="container">
        <div class="card">
            <h2>Welcome to my page!</h2>
            <p>This is a simple demonstration of HTML, CSS, and JavaScript working together.</p>
            
            <div>
                <h3>Counter Example</h3>
                <div class="counter-display" id="counter">0</div>
                <button class="btn" id="incrementBtn">Increment</button>
                <button class="btn" id="resetBtn">Reset</button>
            </div>
        </div>

        <div class="card">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message" rows="4" required></textarea>
                <button type="submit" class="btn">Submit</button>
            </form>
            <p id="formMessage"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Simple Web Page. All rights reserved.</p>
    </footer>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        });

        // Counter functionality
        let count = 0;
        const counter = document.getElementById('counter');
        const incrementBtn = document.getElementById('incrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        incrementBtn.addEventListener('click', () => {
            count++;
            counter.textContent = count;
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            counter.textContent = count;
        });

        // Form handling
        const contactForm = document.getElementById('contactForm');
        const formMessage = document.getElementById('formMessage');

        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            // Simple validation
            if (name && email && message) {
                // In a real application, you would send this data to a server
                formMessage.textContent = `Thanks for your message, ${name}! We'll get back to you soon.`;
                formMessage.style.color = 'green';
                contactForm.reset();
            } else {
                formMessage.textContent = 'Please fill out all fields.';
                formMessage.style.color = 'red';
            }
        });
    </script>
</body>
</html>
