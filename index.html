<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stingy Men ID Card Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f0f0f0;
      color: #003300;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
    }

    input[type="text"], input[type="number"], input[type="file"], input[type="date"] {
      width: 100%;
      padding: 6px;
    }

    #card-preview {
      width: 336px;
      height: 213px;
      background: #ffffff no-repeat center/cover;
      color: black;
      position: relative;
      padding: 10px;
      box-sizing: border-box;
      text-align: left;
    }

    #logo {
      position: absolute;
      top: 70px;
      right: 10px;
      width: 90px;
      height: 90px;
      border-radius: 5px;
      background: white;
      object-fit: contain;
    }

    #association {
      font-size: 12px;
      font-weight: bold;
      margin-top: 0;
      margin-left: 65px;
    }

    #motto {
      font-size: 10px;
      margin-left: 65px;
      font-style: italic;
    }

    .info {
      font-size: 12px;
      margin: 2px 0;
    }

    #barcode-canvas, #barcode-svg {
      position: absolute;
      top: 165px;
      right: 10px;
      width: 90px;
      height: 20px;
      background: white;
    }

    button {
      padding: 10px;
      background: forestgreen;
      color: white;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<h2>Stingy Men Association ID Generator</h2>

<div class="form-group">
  <label>Upload Profile Photo</label>
  <input type="file" id="logoInput">
</div>
<div class="form-group">
  <label>Upload Background Photo</label>
  <input type="file" id="imgInput">
</div>
<div class="form-group">
  <label>Name</label>
  <input type="text" id="nameInput">
</div>
<div class="form-group">
  <label>ID Number</label>
  <input type="text" id="idInput">
</div>
<div class="form-group">
  <label>Program</label>
  <input type="text" id="branchInput">
</div>
<div class="form-group">
  <label>Position</label>
  <input type="text" id="positionInput">
</div>
<div class="form-group">
  <label>Expiration Date</label>
  <input type="date" id="expiryInput">
</div>

<div id="card-preview">
  <img id="logo" src="" alt="Profile">
  <p id="association">STINGY MEN ASSOCIATION OF MZUNI</p>
  <p id="motto">MOTTO: Let me see what I can.</p>  
  <p id="id-card">IDENTIFICATION CARD</p>
  <p class="info" id="card-name"></p>
  <p class="info" id="card-id"></p>
  <p class="info" id="card-branch"></p>
  <p class="info" id="card-position"></p>
  <p class="info" id="card-expiry"></p>
  <svg id="barcode-svg" style="display: none;"></svg>
  <canvas id="barcode-canvas"></canvas>
</div>

<div>
  <button onclick="downloadPNG()">Download PNG</button>
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<script>
  const logoInput = document.getElementById('logoInput');
  const imgInput = document.getElementById('imgInput');
  const nameInput = document.getElementById('nameInput');
  const idInput = document.getElementById('idInput');
  const branchInput = document.getElementById('branchInput');
  const positionInput = document.getElementById('positionInput');
  const expiryInput = document.getElementById('expiryInput');

  const logo = document.getElementById('logo');
  const cardName = document.getElementById('card-name');
  const cardID = document.getElementById('card-id');
  const cardBranch = document.getElementById('card-branch');
  const cardPosition = document.getElementById('card-position');
  const cardExpiry = document.getElementById('card-expiry');
  const barcodeSvg = document.getElementById('barcode-svg');
  const barcodeCanvas = document.getElementById('barcode-canvas');
  const cardPreview = document.getElementById('card-preview');

  logoInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = evt => logo.src = evt.target.result;
      reader.readAsDataURL(file);
    }
  });

  imgInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = evt => {
        cardPreview.style.backgroundImage = `url(${evt.target.result})`;
      };
      reader.readAsDataURL(file);
    }
  });

  [nameInput, idInput, branchInput, positionInput, expiryInput].forEach(input => {
    input.addEventListener('input', updateCard);
  });

  function updateCard() {
    const idVal = idInput.value || '0000';
    cardName.textContent = 'NAME: ' + nameInput.value;
    cardID.textContent = 'ID NUMBER: ' + idVal;
    cardBranch.textContent = 'PROGRAM: ' + branchInput.value;
    cardPosition.textContent = 'POSITION: ' + positionInput.value;
    cardExpiry.textContent = expiryInput.value ? 'Expires: ' + expiryInput.value : '';

    // Generate barcode in hidden SVG
    JsBarcode(barcodeSvg, idVal, {
      format: "CODE128",
      displayValue: false,
      width: 1.5,
      height: 30
    });

    // Convert SVG to canvas
    const svgData = new XMLSerializer().serializeToString(barcodeSvg);
    const img = new Image();
    img.onload = () => {
      const ctx = barcodeCanvas.getContext('2d');
      ctx.clearRect(0, 0, barcodeCanvas.width, barcodeCanvas.height);
      ctx.drawImage(img, 0, 0, barcodeCanvas.width, barcodeCanvas.height);
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
  }

  function downloadPNG() {
    html2canvas(cardPreview).then(canvas => {
      const link = document.createElement('a');
      link.download = 'sma-id-card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  async function downloadPDF() {
    const canvas = await html2canvas(cardPreview);
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
    pdf.addImage(imgData, 'PNG', 0, 0, 85.6, 54);
    pdf.save('sma-id-card.pdf');
  }
</script>

</body>
</html>
